const QN=Q.length,MAX=QN*10+20;

/* ---------- state ---------- */
let L="en",tx=T.en,score=0,qi=0,step=0,steps=[];
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id));scrollTo(0,0)}
function buildSteps(){steps=[];for(let i=0;i<QN;i++){if(i%6===0){steps.push({t:"lvl",n:i/6})}steps.push({t:"q",i});if(i===17)steps.push({t:"mini"})}steps.push({t:"end"})}

/* ---------- 1. language ---------- */
document.querySelectorAll("#s-lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;tx=T[L];document.documentElement.lang=L==="en"?"en":"fr";setupLove();show("s-love")});

/* ---------- 2. do you love me ---------- */
let dodges=0;
function setupLove(){
  $("lq").textContent=tx.lq;$("ls").textContent=tx.ls;
  $("yes").firstChild.textContent=tx.yes;$("no").firstChild.textContent=tx.no;
}
function dodge(e){
  if(e&&e.cancelable)e.preventDefault();
  const no=$("no"),yes=$("yes");dodges++;
  yes.style.transform="scale("+Math.min(1+dodges*.07,1.7)+")";
  no.classList.add("fly");
  if(dodges>6)no.style.fontSize=Math.max(11,17-(dodges-6))+"px";
  const yr=yes.getBoundingClientRect(),w=no.offsetWidth,h=no.offsetHeight,W=innerWidth,H=innerHeight,m=18;
  let x=8,y=8;
  for(let i=0;i<80;i++){
    x=8+Math.random()*Math.max(1,W-w-16);y=8+Math.random()*Math.max(1,H-h-16);
    if(x+w+m<yr.left||x-m>yr.right||y+h+m<yr.top||y-m>yr.bottom)break;
  }
  no.style.left=x+"px";no.style.top=y+"px";
  $("taunt").textContent=tx.taunts[(dodges-1)%tx.taunts.length];
  if(navigator.vibrate)navigator.vibrate(20);
}
const noB=$("no");
["pointerenter","pointerdown","touchstart","click","focus"].forEach(ev=>noB.addEventListener(ev,dodge,{passive:false}));
$("yes").onclick=()=>{boom(80);setupNum();show("s-num");setTimeout(()=>$("num").focus(),400)};

/* ---------- 3. big number ---------- */
function setupNum(){$("nq").textContent=tx.nq;$("num").placeholder=tx.nph;$("nb").firstChild.textContent=tx.nb;$("nf").textContent=""}
function fmt(d){return d.replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function evalNum(){
  const raw=$("num").value,d=raw.replace(/\D/g,""),inf=/∞|infini|infinity|la nihaya|bla 7ad/i.test(raw);
  let tier=0;
  if(inf||d.length>=7)tier=3;else if(d.length>=5)tier=2;else if(d.length>=3)tier=1;
  $("nm").style.width=(inf?100:Math.min(100,d.length/7*100))+"%";
  $("nf").textContent=(d?fmt(d)+" — ":"")+tx.tiers[tier];
  return tier===3;
}
$("num").addEventListener("input",evalNum);
$("num").addEventListener("keydown",e=>{if(e.key==="Enter")$("nb").click()});
$("nb").onclick=()=>{
  if(!evalNum()){if(navigator.vibrate)navigator.vibrate([30,40,30]);return}
  boom(160);setTimeout(()=>{setupIntro();show("s-intro")},900);
};

/* ---------- 4. intro ---------- */
function setupIntro(){$("itag").textContent=tx.itag;$("ih").textContent=tx.ih;$("ip").textContent=tx.ip;$("ib").firstChild.textContent=tx.ib}
$("ib").onclick=()=>{score=0;step=0;buildSteps();run()};

/* ---------- flow ---------- */
function run(){
  const s=steps[step++];
  if(s.t==="lvl"){$("lt").textContent="LEVEL "+(s.n+1)+"/5";$("lh").textContent=tx.lvl[s.n][0];$("lp").textContent=tx.lvl[s.n][1];$("lb").firstChild.textContent=tx.go;show("s-lvl")}
  else if(s.t==="q"){qi=s.i;showQ()}
  else if(s.t==="mini")startMini();
  else finale();
}
$("lb").onclick=run;

/* ---------- questions ---------- */
function showQ(){
  const q=Q[qi],d=q[L];
  $("qlv").textContent=tx.lvl[Math.floor(qi/6)][0];
  $("qn").textContent=(qi+1)+"/"+QN;
  $("qs").textContent="⭐ "+score;
  $("qbar").style.width=(qi/QN*100)+"%";
  $("qt").textContent=d[0];$("react").textContent="";$("qnext").style.display="none";$("qnext").firstChild.textContent=tx.next;
  const box=$("opts");box.innerHTML="";
  const best=Math.max(...q.p);
  d.slice(1).forEach((t,i)=>{
    const b=document.createElement("button");b.className="opt";b.textContent=t;
    b.onclick=()=>pick(i,b,best);box.appendChild(b);
  });
  show("s-q");
}
function pick(i,btn,best){
  const q=Q[qi],pts=q.p[i];score+=pts;$("qs").textContent="⭐ "+score;
  document.querySelectorAll("#opts .opt").forEach((b,k)=>{b.disabled=true;if(k===i)b.classList.add("hit");if(q.p[k]===best&&pts===best&&k===i)b.classList.add("best")});
  $("react").textContent=(pts>=10?rnd(tx.good):pts>=5?rnd(tx.mid):rnd(tx.low))+"  +"+pts;
  if(pts>=10){boom(40);if(navigator.vibrate)navigator.vibrate(30)}
  $("qbar").style.width=((qi+1)/QN*100)+"%";
  $("qnext").style.display="";
}
$("qnext").onclick=run;

/* ---------- bonus: catch hearts ---------- */
let mt=null,sp=null;
function startMini(){
  $("mtag").textContent=tx.mtag;$("mh").textContent=tx.mh;$("mp").textContent=tx.mp;
  $("mgo").firstChild.textContent=tx.mgo;$("mgo").style.display="";$("arena").innerHTML="";
  $("mtime").textContent=tx.mtime+": 15";$("mcount").textContent="💖 0/10";show("s-mini");
}
$("mgo").onclick=()=>{
  $("mgo").style.display="none";let t=15,c=0;const ar=$("arena");ar.innerHTML="";
  $("mcount").textContent="💖 0/10";
  function spawn(){
    const b=document.createElement("button"),span=document.createElement("span");
    span.textContent=rnd(["💖","💗","💜","🔥"]);b.appendChild(span);
    b.style.left=Math.random()*(ar.clientWidth-52)+"px";b.style.animationDuration=(1.6+Math.random()*1.4)+"s";
    b.onpointerdown=e=>{e.preventDefault();c++;$("mcount").textContent="💖 "+c+"/10";b.remove();if(navigator.vibrate)navigator.vibrate(15)};
    b.addEventListener("animationend",()=>b.remove());ar.appendChild(b);
  }
  sp=setInterval(spawn,420);
  mt=setInterval(()=>{t--;$("mtime").textContent=tx.mtime+": "+t;if(t<=0){clearInterval(mt);clearInterval(sp);ar.innerHTML="";
    const win=c>=10;if(win)score+=20;boom(win?150:50);
    $("mp").textContent=win?tx.mdone[0]:tx.mdone[1];
    if(!win)score+=0;
    $("mgo").firstChild.textContent=tx.next;$("mgo").style.display="";$("mgo").onclick=run;}},1000);
};

/* ---------- finale ---------- */
let tick=null;
function finale(){
  const pc=score/MAX*100,r=pc>=92?4:pc>=80?3:pc>=65?2:pc>=50?1:0;
  $("etag").textContent=tx.etag;$("erank").textContent=tx.ranks[r];
  $("escore").textContent="⭐ "+score+" / "+MAX+" "+tx.pts;$("ewho").textContent=tx.ewho;
  $("eopen").textContent=tx.open;$("crate").style.display="";$("letter").style.display="none";$("endimg").style.display="none";$("endbtns").style.display="none";
  $("share").firstChild.textContent=tx.share;$("again").firstChild.textContent=tx.again;
  const start=new Date(2026,7,25,22,12,0);
  function upd(){let s=Math.max(0,Math.floor((Date.now()-start)/1000));const v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
    $("cnt").innerHTML=v.map((n,i)=>"<div><b>"+n+"</b><small>"+tx.cd[i]+"</small></div>").join("")}
  upd();clearInterval(tick);tick=setInterval(upd,1000);
  $("bg").dataset.rank=r;show("s-end");boom(220);
  $("share").dataset.msg=tx.sharetxt(tx.ranks[r].split(" ")[0],score,MAX);
}
$("crate").onclick=()=>{
  $("crate").style.display="none";boom(200);$("eopen").textContent=tx.opened;
  const el=$("letter");el.style.display="block";el.textContent="";
  const txt=tx.letter;let i=0;
  if(reduce){el.textContent=txt;done()}else{(function type(){el.textContent=txt.slice(0,i+=2);if(i<txt.length)setTimeout(type,28);else{el.textContent=txt;done()}})()}
  function done(){$("endimg").style.display="block";$("endbtns").style.display="flex";boom(120)}
};
$("share").onclick=async()=>{
  const m=$("share").dataset.msg;
  try{if(navigator.share){await navigator.share({text:m});return}}catch(e){}
  try{await navigator.clipboard.writeText(m);$("share").firstChild.textContent=tx.copied}catch(e){prompt("",m)}
};
$("again").onclick=()=>{clearInterval(tick);score=0;step=0;dodges=0;$("yes").style.transform="";$("no").className="";$("no").removeAttribute("style");$("taunt").textContent="";$("num").value="";$("nm").style.width="0";show("s-lang")};
</script>
